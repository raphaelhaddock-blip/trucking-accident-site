<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" fill="none" role="img" aria-label="Abstract interstate freight network">
  <!-- Decorative national freight-corridor network. Abstract motif, not real data. -->
  <g stroke="#a4b5c9" stroke-opacity="0.16" stroke-width="1.5">
    <path d="M120 250 C 260 180, 360 320, 470 250 S 700 160, 840 250 1080 300, 1120 220"/>
    <path d="M150 420 C 320 380, 430 470, 600 430 S 900 360, 1080 430"/>
    <path d="M300 150 L 470 250 L 560 470"/>
    <path d="M470 250 L 640 410 L 840 250"/>
    <path d="M640 410 L 600 430 L 920 470"/>
    <path d="M840 250 L 980 200 L 1080 300"/>
    <path d="M200 360 L 430 300 L 600 260"/>
    <path d="M120 250 L 200 360 L 300 150"/>
  </g>
  <!-- Active corridors (amber) -->
  <g stroke="#f5a300" stroke-opacity="0.5" stroke-width="2">
    <path d="M300 150 L 470 250 L 640 410 L 920 470"/>
    <path d="M600 260 L 840 250 L 1080 300"/>
  </g>
  <!-- Network nodes -->
  <g fill="#a4b5c9" fill-opacity="0.55">
    <circle cx="120" cy="250" r="3"/><circle cx="200" cy="360" r="3"/><circle cx="300" cy="150" r="3"/>
    <circle cx="430" cy="300" r="3"/><circle cx="560" cy="470" r="3"/><circle cx="600" cy="260" r="3"/>
    <circle cx="640" cy="410" r="3"/><circle cx="980" cy="200" r="3"/><circle cx="1080" cy="300" r="3"/>
    <circle cx="1120" cy="220" r="3"/><circle cx="150" cy="420" r="3"/><circle cx="1080" cy="430" r="3"/>
  </g>
  <!-- Major junctions (amber, with halo) -->
  <g>
    <circle cx="470" cy="250" r="9" fill="#f5a300" fill-opacity="0.14"/>
    <circle cx="470" cy="250" r="4" fill="#f5a300"/>
    <circle cx="840" cy="250" r="9" fill="#f5a300" fill-opacity="0.14"/>
    <circle cx="840" cy="250" r="4" fill="#f5a300"/>
    <circle cx="920" cy="470" r="9" fill="#f5a300" fill-opacity="0.14"/>
    <circle cx="920" cy="470" r="4" fill="#f5a300"/>
  </g>
</svg>
