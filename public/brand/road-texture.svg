<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none" role="img" aria-label="Roadway lane texture">
  <defs>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1c30"/>
      <stop offset="0.5" stop-color="#0a1322"/>
      <stop offset="1" stop-color="#0f1c30"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="120" fill="url(#asphalt)"/>
  <!-- Edge lines -->
  <rect x="0" y="20" width="1200" height="2.5" fill="#eef3f9" fill-opacity="0.22"/>
  <rect x="0" y="97.5" width="1200" height="2.5" fill="#eef3f9" fill-opacity="0.22"/>
  <!-- Dashed center lane (amber) -->
  <g fill="#f5a300" fill-opacity="0.85">
    <rect x="40" y="57" width="80" height="6" rx="3"/>
    <rect x="200" y="57" width="80" height="6" rx="3"/>
    <rect x="360" y="57" width="80" height="6" rx="3"/>
    <rect x="520" y="57" width="80" height="6" rx="3"/>
    <rect x="680" y="57" width="80" height="6" rx="3"/>
    <rect x="840" y="57" width="80" height="6" rx="3"/>
    <rect x="1000" y="57" width="80" height="6" rx="3"/>
  </g>
</svg>
